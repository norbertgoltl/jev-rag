[project]
name = "jev-rag-api"
version = "0.1.0"
description = "Jev RAG Foundation API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project.scripts]
jev-rag-api = "jev_rag_api.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
